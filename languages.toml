[language-server]
biome = { command = "biome", args = ["lsp-proxy"] }
tsgo = { command = "tsgo", args = ["--lsp", "-stdio"] }

[[language]]
name = "javascript"
language-servers = [ { name = "tsgo", except-features = [ "format" ] }, "biome" ]
auto-format = true

[[language]]
name = "typescript"
language-servers = [ { name = "tsgo", except-features = [ "format" ] }, "biome" ]
auto-format = true

[[language]]
name = "tsx"
auto-format = true
language-servers = [ { name = "tsgo", except-features = [ "format" ] }, "biome" ]

[[language]]
name = "jsx"
auto-format = true
language-servers = [ { name = "tsgo", except-features = [ "format" ] }, "biome" ]

[[language]]
name = "json"
auto-format = true
language-servers = [ { name = "vscode-json-language-server", except-features = [ "format" ] }, "biome" ]

[[language]]
name = "jsonc"
auto-format = true
language-servers = [ "biome" ]

[[language]]
name = "css"
auto-format = true
language-servers = [ "biome" ]
